<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1B2A3A" />
  <title>UNION ONE 견적서 서명</title>

  <style>
    /* Pretendard 는 index.html 과 같은 폴더의 파일을 씁니다. */
    @font-face {
      font-family: "UOPretendard";
      src: local("Pretendard Variable"), local("Pretendard"),
           url("./PretendardVariable.woff2") format("woff2");
      font-style: normal;
      font-weight: 45 920;
      font-display: swap;
    }

    /* ★ 2.0 (2026-10-01) — 견적서 · 앱과 같은 남색 잉크 · 주황 신호색. 고객이 보는 화면이라 정돈된 문서가 먼저.
       이 화면은 밝은 배경 하나로만 씁니다 (어두운 모드 폰에서 뒤집히지 않게). */
    :root {
      color-scheme: light;
      --bg: #EEF0EC; --surface: #FFFFFF; --line: #DDE0DA; --line-2: #C6CBC3;
      --ink: #14181D; --ink-2: #3F4650; --ink-3: #5F6772;
      --brand: #1B2A3A; --accent: #D2601F; --accent-soft: #FCEEE4; --accent-ink: #A9480F;
      --ok: #1E7149; --danger: #B3261E;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "UOPretendard", "Pretendard", -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      font-variant-numeric: tabular-nums;
      word-break: keep-all;
      overscroll-behavior-y: contain;
    }

    .wrap {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 0 14px calc(28px + env(safe-area-inset-bottom));
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(0, 1fr);
    }

    .head {
      margin: 0 -14px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .head img { width: 120px; height: auto; display: block; }
    .head-text { min-width: 0; padding-left: 14px; border-left: 1px solid var(--line); }
    .head-title { font-size: 17px; font-weight: 850; letter-spacing: -.3px; }
    .head-sub { margin-top: 2px; font-size: 14px; font-weight: 600; color: var(--ink-3); }
    .head-sub { word-break: keep-all; }
    .head-code { white-space: nowrap; }

    .paper-shell {
      padding: 10px;
      border-radius: 16px;
      background: #E3E6E0;
    }
    .paper-inner { background: #fff; overflow: hidden; box-shadow: 0 10px 30px rgba(20,24,29,.16); }

    .panel {
      padding: 18px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .amount-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      font-weight: 650;
      color: var(--ink-3);
    }
    .amount-row strong { color: var(--ink); font-weight: 800; }
    .amount-row.grand {
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 14px 16px;
      margin-top: 4px;
      border-radius: 12px;
      background: var(--brand);
      color: rgba(255,255,255,.82);
      font-size: 14px;
    }
    .amount-row.grand strong { align-self: flex-end; font-size: 28px; color: #fff; letter-spacing: -.6px; }

    .guide {
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: #5A3317;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.6;
    }
    .guide strong { color: var(--accent-ink); }

    .btn {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      font-family: inherit;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .08s ease, opacity .08s ease;
    }
    .btn:active { transform: scale(.99); opacity: .94; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.ghost {
      background: var(--surface);
      color: var(--ink-2);
      border: 1px solid var(--line-2);
      min-height: 52px;
      font-size: 16px;
    }
    #submitBtn { background: var(--accent); }

    .status {
      min-height: 20px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--ink-3);
    }
    .status.error { color: var(--danger); }
    .status.done { color: var(--ok); }

    .state-box {
      padding: 40px 22px;
      text-align: center;
      display: grid;
      gap: 10px;
      justify-items: center;
    }
    .state-title { font-size: 22px; font-weight: 850; letter-spacing: -.6px; }
    .state-text { font-size: 15px; font-weight: 600; line-height: 1.6; color: var(--ink-3); }

    .spinner {
      width: 34px; height: 34px;
      border: 4px solid rgba(27,42,58,.18);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .done-mark {
      width: 62px; height: 62px;
      border-radius: 50%;
      background: var(--ok);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 900;
    }

    /* 넓은 화면(태블릿 대면 · PC) — 견적서 옆에 금액 · 서명 */
    @media (min-width: 900px) {
      .wrap { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
      .head { grid-column: 1 / -1; }
      #statePanel { grid-column: 1 / -1; }
      #actionPanel { position: sticky; top: 16px; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="wrap">
    <header class="head">
      <img src="./uo-logo.png" alt="UNION ONE" />
      <div class="head-text">
        <div class="head-title">현장 견적서</div>
        <div class="head-sub" id="headSub">불러오는 중입니다.</div>
      </div>
    </header>

    <!-- 불러오는 중 / 오류 -->
    <section class="panel" id="statePanel">
      <div class="state-box">
        <div class="spinner" id="stateSpinner"></div>
        <div class="state-title" id="stateTitle">견적서를 불러오는 중입니다</div>
        <div class="state-text" id="stateText">잠시만 기다려 주세요.</div>
      </div>
    </section>

    <!-- 견적서 -->
    <section class="paper-shell hidden" id="paperShell">
      <div class="paper-inner" id="paperHost"></div>
    </section>

    <!-- 금액 / 서명 -->
    <section class="panel hidden" id="actionPanel">
      <div class="amount-row"><span>공급가액</span><strong id="sumSupply">-</strong></div>
      <div class="amount-row"><span>부가세 10%</span><strong id="sumVat">-</strong></div>
      <div class="amount-row grand"><span>합계 (부가세 포함)</span><strong id="sumTotal">-</strong></div>

      <div class="guide" id="guideBox">
        견적 내용을 확인하신 뒤 <strong>서명하기</strong>를 눌러 주세요.<br />
        견적서의 <strong>발주자 (인)</strong> 칸을 직접 눌러도 됩니다.
      </div>

      <button type="button" class="btn" id="signBtn">서명하기</button>
      <button type="button" class="btn ghost hidden" id="resignBtn">서명 다시 하기</button>
      <button type="button" class="btn hidden" id="submitBtn">서명 제출하기</button>

      <div class="status" id="statusText"></div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="./uo-doc.js"></script>

  <script>
    /* =====================================================================
       고객 폰 서명 페이지

       주소 형식
         sign.html?code=UO-260825-001&t=토큰

       토큰이 없거나 틀리면 서버가 견적서를 내려주지 않습니다.
       견적번호가 규칙적이라 번호만으로는 열리지 않게 막는 장치입니다.
       ===================================================================== */

    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbz_r9I9Tj3Qt5tE9OqrvY7sdDYGBpkffL4gbNhK6k0ZmlzWOB-vluRRY-Nvgmylgmq1Ng/exec";

    const D = window.UODoc;
    /* 주소에서 견적번호와 토큰을 꺼냅니다.
       문자 앱이 & 를 만나면 링크를 잘라 버리는 경우가 있어
       기본 형식은 k=견적번호.토큰 하나로 보냅니다.
       예전에 보낸 code=..&t=.. 형식도 계속 열리게 함께 지원합니다. */
    const params = new URLSearchParams(location.search);

    let CODE = (params.get("code") || "").trim();
    let TOKEN = (params.get("t") || "").trim();

    const packed = (params.get("k") || "").trim();
    if (packed) {
      const dot = packed.lastIndexOf(".");
      if (dot > 0) {
        CODE = packed.slice(0, dot);
        TOKEN = packed.slice(dot + 1);
      }
    }

    // 해시(#)로 들어온 경우도 받아 줍니다.
    if (!CODE && location.hash) {
      const hashPacked = location.hash.replace(/^#k?=?/, "").trim();
      const dot = hashPacked.lastIndexOf(".");
      if (dot > 0) {
        CODE = hashPacked.slice(0, dot);
        TOKEN = hashPacked.slice(dot + 1);
      }
    }

    let docData = null;
    let signature = null;
    let submitted = false;

    const el = (id) => document.getElementById(id);

    /* ---------- 서버 통신 ---------- */
    const JSONP_TIMEOUT = 30000;

    function jsonpOnce(query, timeout) {
      return new Promise((resolve, reject) => {
        const name = "uoSign_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        let done = false;

        const timer = setTimeout(() => {
          if (done) return;
          cleanup();
          reject(new Error("서버 응답이 늦습니다."));
        }, timeout);

        function cleanup() {
          done = true;
          clearTimeout(timer);
          window[name] = function () {};
          setTimeout(() => { try { delete window[name]; } catch (e) { window[name] = undefined; } }, 60000);
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[name] = (data) => { if (done) return; cleanup(); resolve(data || {}); };

        const q = new URLSearchParams({ ...query, callback: name, t2: String(Date.now()) });
        script.src = GOOGLE_SHEET_API_URL + "?" + q.toString();
        script.onerror = () => { if (done) return; cleanup(); reject(new Error("서버에 연결하지 못했습니다.")); };
        document.body.appendChild(script);
      });
    }

    async function jsonpRequest(query) {
      let lastError = null;
      for (let i = 0; i < 2; i++) {
        try { return await jsonpOnce(query, JSONP_TIMEOUT); }
        catch (err) {
          lastError = err;
          if (i === 0) await new Promise(r => setTimeout(r, 700));
        }
      }
      throw lastError || new Error("서버 응답이 없습니다.");
    }

    /* ---------- 화면 ---------- */
    function showState(title, text, opts) {
      const o = opts || {};
      el("stateSpinner").classList.toggle("hidden", !o.loading);
      el("stateTitle").textContent = title;
      el("stateTitle").style.color = o.error ? "#C0392B" : "#111";
      el("stateText").innerHTML = text;
      el("statePanel").classList.remove("hidden");
      el("paperShell").classList.add("hidden");
      el("actionPanel").classList.add("hidden");
      el("headSub").textContent = o.error ? "열 수 없는 견적서입니다." : "불러오는 중입니다.";
    }

    function renderPaper() {
      const data = Object.assign({}, docData, {
        sign: signature || {},
        // 아직 제출 전이면 견적서의 발주자 칸을 직접 눌러도 서명창이 열립니다.
        signable: !submitted
      });

      const host = el("paperHost");
      host.innerHTML = D.screenShell(D.buildDoc(data, ""));
      D.fitScreenDoc(host.querySelector(".nc2-screen-host"), null);
    }

    /* 견적서 안의 발주자 칸을 눌렀을 때 */
    document.addEventListener("click", function (e) {
      const box = e.target.closest('[data-nc2-sign="customer"]');
      if (!box || submitted) return;
      e.preventDefault();
      startSign();
    });

    window.addEventListener("resize", function () {
      const host = el("paperHost").querySelector(".nc2-screen-host");
      if (host) D.fitScreenDoc(host, null);
    });

    /* ---------- 불러오기 ---------- */
    async function load() {
      D.injectStyle();

      if (!CODE || !TOKEN) {
        const got = (location.search || location.hash || "").slice(0, 120);
        showState("주소가 올바르지 않습니다",
          "문자로 받으신 링크를 <strong>끝까지</strong> 눌러 주세요.<br />" +
          "링크가 잘린 경우 담당자에게 다시 요청해 주세요." +
          (got ? '<br /><span style="font-size:11px;color:#aaa;word-break:break-all;">받은 주소: ' +
                 got.replace(/</g, "&lt;") + "</span>" : ""),
          { error: true });
        return;
      }

      showState("견적서를 불러오는 중입니다", "잠시만 기다려 주세요.", { loading: true });

      try {
        const result = await jsonpRequest({ action: "signDoc", code: CODE, t: TOKEN });

        if (!result || !result.ok) {
          showState("견적서를 열 수 없습니다",
            (result && result.message ? result.message : "링크가 만료되었거나 올바르지 않습니다.") +
            "<br />담당자에게 문의해 주세요.",
            { error: true });
          return;
        }

        docData = result.doc || {};

        // 이미 서명이 끝난 건이면 서명본 상태로만 보여 줍니다.
        if (result.signed) {
          signature = { dataUrl: result.signImage || "", signedAt: result.signedAt || "" };
          D.loadStamp(function () { if (docData) renderPaper(); });
          showAfterLoad();
          markDone("이미 서명이 완료된 견적서입니다.",
            result.signedAt ? ("서명일시 " + result.signedAt) : "");
          return;
        }

        D.loadStamp(function () { if (docData) renderPaper(); });
        showAfterLoad();
      } catch (err) {
        console.error(err);
        showState("연결에 실패했습니다",
          "인터넷 상태를 확인한 뒤 링크를 다시 눌러 주세요.", { error: true });
      }
    }

    function showAfterLoad() {
      el("statePanel").classList.add("hidden");
      el("paperShell").classList.remove("hidden");
      el("actionPanel").classList.remove("hidden");

      el("headSub").textContent = (docData.customerName || "-") + " 귀하 · ";
      // 견적번호는 한 덩어리로 — 폰에서 'UO-' 뒤에서 끊겼다 (2.0 · 검수 1차)
      const codeEl = document.createElement("span");
      codeEl.className = "head-code";
      codeEl.textContent = docData.code || "";
      el("headSub").appendChild(codeEl);

      el("sumSupply").textContent = D.num(docData.supply) + "원";
      el("sumVat").textContent = D.num(docData.vat) + "원";
      el("sumTotal").textContent = D.num(docData.total) + "원";

      renderPaper();
    }

    /* ---------- 서명 ---------- */
    function startSign() {
      D.openSignPad(function (result) {
        signature = result;
        renderPaper();

        el("signBtn").classList.add("hidden");
        el("resignBtn").classList.remove("hidden");
        el("submitBtn").classList.remove("hidden");

        const guide = el("guideBox");
        if (guide) {
          guide.innerHTML =
            "서명이 견적서에 들어갔습니다.<br />" +
            "아래 <strong>서명 제출하기</strong>를 눌러야 시공사에 전달됩니다.";
        }

        el("submitBtn").scrollIntoView({ behavior: "smooth", block: "center" });
      });
    }

    el("signBtn").addEventListener("click", startSign);
    el("resignBtn").addEventListener("click", startSign);

    /* ---------- 제출 ---------- */
    el("submitBtn").addEventListener("click", async function () {
      if (submitted || !signature) return;

      const btn = el("submitBtn");
      const status = el("statusText");

      btn.disabled = true;
      el("resignBtn").disabled = true;
      btn.textContent = "서명본 만드는 중...";
      status.className = "status";
      status.textContent = "잠시만 기다려 주세요.";

      try {
        const data = Object.assign({}, docData, { sign: signature, signable: false });
        const blob = await D.makePdfBlob(data);
        const base64 = await D.blobToBase64(blob);

        btn.textContent = "전송 중...";
        status.textContent = "시공사에 전달하고 있습니다.";

        const response = await fetch(GOOGLE_SHEET_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "saveSignature",
            code: CODE,
            t: TOKEN,
            signedAt: signature.signedAt,
            signImage: signature.dataUrl,
            pdfBase64: base64
          })
        });

        const result = await response.json();
        if (!result || !result.ok) {
          throw new Error((result && result.message) || "전송하지 못했습니다.");
        }

        submitted = true;
        markDone("서명이 완료되었습니다.", "서명일시 " + (signature.signedAt || ""));
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        el("resignBtn").disabled = false;
        btn.textContent = "서명 제출하기";
        status.className = "status error";
        status.textContent = err.message || "전송에 실패했습니다. 잠시 후 다시 눌러 주세요.";
      }
    });

    function markDone(title, sub) {
      el("signBtn").classList.add("hidden");
      el("resignBtn").classList.add("hidden");
      el("submitBtn").classList.add("hidden");

      el("guideBox").outerHTML =
        '<div class="state-box">' +
          '<div class="done-mark">✓</div>' +
          '<div class="state-title">' + title + "</div>" +
          '<div class="state-text">' + (sub || "") +
            "<br />시공사에서 곧 연락드립니다.</div>" +
        "</div>";

      const status = el("statusText");
      status.className = "status done";
      status.textContent = "이 화면은 닫으셔도 됩니다.";
    }

    load();
  </script>
</body>
</html>
